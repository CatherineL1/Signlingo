<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SignLingo-Lite | ASL Fingerspelling Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;font-family:system-ui;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center}
    h1{font-size:1.4rem;margin:.3em 0}
    #cam{width:100%;max-width:640px;border-radius:8px}
    #cv{position:relative;width:100%;max-width:640px;height:360px;background:#000;border-radius:8px;margin-top:.5em}
    #overlay{position:absolute;top:0;left:0;width:100%;height:100%}
    #bar{height:6px;background:#0f0;transition:width .1s}
    #word{font-size:1.8rem;margin:.5em 0;letter-spacing:.2em}
    #score{font-size:1rem;color:#ffa}
    button{padding:.4em .8em;font-size:1rem;border:none;border-radius:4px;cursor:pointer;background:#28f;color:#fff}
    button:disabled{background:#555;cursor:not-allowed}
  </style>
</head>
<body>
  <h1>SignLingo-Lite</h1>
  <video id="cam" autoplay playsinline></video>
  <div id="cv">
    <canvas id="overlay"></canvas>
  </div>
  <div id="bar"></div>

  <div id="word">PRESS START</div>
  <button id="startBtn">Start Practice</button>
  <div id="score"></div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.min.js"></script>
  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>

  <script>
    const LABELS = ['A','B','C','D','E','F','G','H','I','K','L','M','N','O','P','Q','R','S','T','U','V','W','X','Y']; // 24 (no J,Z motion)
    const WORDS  = ['CAT','DOG','HAT','CUP','BAG','ICE','KEY','SUN','MOON','STAR','BLUE','RED','GREEN','SIGN','WORD'];
    let model, hands, camera, currentWord='', pos=0, correct=0, total=0;
    const video  = document.getElementById('cam');
    const canvas = document.getElementById('overlay');
    const ctx    = canvas.getContext('2d');
    const bar    = document.getElementById('bar');
    const wordEl = document.getElementById('word');
    const scoreEl= document.getElementById('score');
    const btn    = document.getElementById('startBtn');

    /*----- webcam -----*/
    async function initCam(){
      const stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:360}});
      video.srcObject = stream;
      return new Promise(res=>video.onloadedmetadata=res);
    }
    /*----- model -----*/
    async function loadModel(){
      model = await tf.loadGraphModel('model/model.json');
    }
    /*----- MediaPipe -----*/
    function initHands(){
      hands = new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
      hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.7,minTrackingConfidence:.7});
      hands.onResults(onResults);
      camera = new Camera(video,{onFrame:async()=>{await hands.send({image:video});},width:640,height:360});
      camera.start();
    }
    /*----- canvas sizing -----*/
    function resizeCanvas(){
      const box=document.getElementById('cv');
      canvas.width=box.clientWidth; canvas.height=box.clientHeight;
    }
    window.addEventListener('resize',resizeCanvas); resizeCanvas();

    /*----- normalize landmarks -----*/
    function norm21(landmarks){
      const wrist = landmarks[0];
      const ref   = dist(landmarks[0],landmarks[9]);
      const out   = [];
      for(const p of landmarks){
        out.push((p.x-wrist.x)/ref, (p.y-wrist.y)/ref, (p.z-wrist.z)/ref);
      }
      return out; // 63 floats
    }
    function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);}

    /*----- inference -----*/
    let last='', hold=0, conf=0;
    async function onResults(results){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if(results.multiHandLandmarks && results.multiHandLandmarks[0]){
        const vec = norm21(results.multiHandLandmarks[0]);
        const prob = await model.predict(tf.tensor2d([vec]));
        const vals = await prob.data();
        const idx  = vals.indexOf(Math.max(...vals));
        conf = vals[idx];
        last = LABELS[idx];
        drawLandmarks(results.multiHandLandmarks[0]);
      }else{last=''; conf=0;}
      bar.style.width=(conf*100)+'%';
      if(currentWord && last===currentWord[pos] && conf>.85){
        hold++;
        if(hold>15){ // ~0.5s
          pos++; correct++; total++;
          updateUI();
          hold=0;
        }
      }else{hold=0;}
      ctx.save();
      ctx.font='bold 60px sans-serif';
      ctx.fillStyle=`rgba(255,255,255,${conf})`;
      ctx.fillText(last||'?',20,80);
      ctx.restore();
    }
    function drawLandmarks(pts){
      ctx.strokeStyle='cyan'; ctx.lineWidth=2;
      for(let i=0;i<21;++i){
        const x=pts[i].x*canvas.width, y=pts[i].y*canvas.height;
        ctx.beginPath(); ctx.arc(x,y,4,0,2*Math.PI); ctx.stroke();
      }
    }
    /*----- practice loop -----*/
    btn.onclick=()=>{
      newWord();
      btn.disabled=true;
      scoreEl.textContent='';
    };
    function newWord(){
      currentWord = WORDS[Math.floor(Math.random()*WORDS.length)];
      pos=0;
      updateUI();
    }
    function updateUI(){
      let disp='';
      for(let i=0;i<currentWord.length;++i){
        disp+=i<pos?currentWord[i]:'_';
      }
      wordEl.textContent=disp;
      if(pos===currentWord.length){
        scoreEl.textContent=`✅ ${currentWord}  (${correct}/${total} letters)`;
        setTimeout(newWord,1200);
      }
    }

    /*----- boot -----*/
    (async()=>{
      await initCam();
      await loadModel();
      initHands();
      if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
    })();
  </script>
</body>
</html>
